<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotizador Multiple</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <div class="container-cotizador">
    <h1>Cotiza tu obra</h1>
    <h4>
      Elige el tipo de obra, ingresa la cantidad de metros cuadrados y calcula una estimacion.
      La lista de productos se actualiza automaticamente desde Google Sheets.
    </h4>

    <div id="cotizadorStatus" class="cotizador-status" style="display: none"></div>
    <div id="cotizadorButtons" class="cotizador-buttons"></div>

    <div>
      <label for="metros">Metros cuadrados:</label>
      <input type="number" id="metros" placeholder="Ingresa los metros cuadrados" min="0" step="0.01" />
    </div>

    <button id="calcular" style="margin-bottom: 20px">Calcular</button>
    <div id="resultado"></div>
    <button id="whatsappButton" style="display: none">Consultar por WhatsApp</button>
  </div>

  <script>
    window.COTIZADOR_CONFIG = {
      apiUrl: "/api/cotizador",
      fallbackUrl: "/assets/js/cotizadores-fallback.json",
      whatsappPhone: "541138009483"
    };
  </script>
  <script src="assets/js/cotizador-app.js" defer></script>
</body>

</html>
